# gitleaks config -- default ruleset only (public GitHub repo, ADR-090).
# Public GitHub-canonical repos (ADR-075) decouple from the homelab
# delivered-base model: no homelab-custom rules, no delivered base, no
# dependency on the internal base serve. The gitleaks default ruleset still
# catches the dangerous generic shapes (cloud keys, PEM blocks).
# Managed by sync-gitleaks-config.py. See ADR-090, ADR-088, Vikunja #1370.
[extend]
useDefault = true